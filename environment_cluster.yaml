name: loki
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # System/rendering libraries (conda handles these better than pip)
  - conda-forge::glew
  - conda-forge::mesalib
  - conda-forge::libgl
  - patchelf
  # All Python packages via pip
  - pip
  - pip:
    - -r requirements.txt
  # NOTE: PyTorch must be installed separately via pip after env creation:
  #   For CUDA 12.3:
  #     pip install torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cu124
  #   For CUDA 11.8:
  #     pip install torch==2.9.1 torchvision==0.24.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cu118
