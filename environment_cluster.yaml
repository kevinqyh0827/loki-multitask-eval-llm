name: loki
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # System/rendering libraries (conda handles these better than pip)
  - conda-forge::glew
  - conda-forge::mesalib
  - conda-forge::libgl
  - patchelf
  # PyTorch + CUDA — choose ONE of the following pytorch-cuda lines:
  #   For cluster CUDA 12.3: use pytorch-cuda=12.4 (backward compatible)
  #   For cluster CUDA 11.8: use pytorch-cuda=11.8
  - pytorch::pytorch=2.9.*
  - pytorch::torchvision=0.24.*
  - pytorch::torchaudio=2.9.*
  - pytorch::pytorch-cuda=12.4
  # All other Python packages via pip
  - pip
  - pip:
    - -r requirements.txt
